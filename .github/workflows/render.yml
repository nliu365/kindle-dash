name: Render Kindle dashboard

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for testing

permissions:
  contents: write             # only used by the monthly keep-alive commit below

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/requirements.txt

      - name: Install fonts (Latin + Chinese)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - run: pip install -r render/requirements.txt

      - name: Render images
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          ALARMS:   ${{ vars.ALARMS }}
          LAT:      ${{ vars.LAT || '37.3688' }}
          LON:      ${{ vars.LON || '-122.0363' }}
          TZ_NAME:  ${{ vars.TZ_NAME || 'America/Los_Angeles' }}
          UNITS:    ${{ vars.UNITS || 'imperial' }}
          OUT: out/dash.png
        run: mkdir -p out && python render/render.py

      - name: Upload to Cloudflare KV
        env:
          CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          ALARMS:             ${{ vars.ALARMS }}
        run: |
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values"
          put() { curl -fsS -X PUT "$base/$1" -H "Authorization: Bearer $CF_API_TOKEN" --data-binary "$2" > /dev/null; }
          put dash.png  @out/dash.png
          put alarm.png @out/alarm.png
          printf '%s' "$ALARMS" > out/alarms.txt
          put alarms    @out/alarms.txt
          echo "uploaded"

      # GitHub pauses scheduled workflows in repos with no activity for 60 days.
      # One empty commit on the 1st of each month keeps the schedule alive.
      - name: Monthly keep-alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ] && [ "$(date -u +%M)" -lt 15 ]; then
            git config user.name  "kindle-dash bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive $(date -u +%F)"
            git push
          fi
