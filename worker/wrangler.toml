name = "kindle-dash"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true   # don't wipe variables set in the Cloudflare dashboard

[triggers]
crons = ["*/15 * * * *"]   # asks GitHub to re-render the dashboard

[vars]
GH_REPO = "nliu365/kindle-dash"
TZ_NAME = "America/Los_Angeles"
ALARM_MINUTES = "5"
# Secrets:  npx wrangler secret put KEY   and   npx wrangler secret put GH_TOKEN

[[kv_namespaces]]
binding = "DASH"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"
