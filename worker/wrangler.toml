name = "kindle-dash"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true   # don't wipe variables set in the Cloudflare dashboard

[triggers]
crons = ["*/15 * * * *"]   # asks GitHub to re-render the dashboard

[vars]
TZ_NAME = "America/Los_Angeles"
ALARM_MINUTES = "5"
# Set these yourself (not stored in the repo):
#   npx wrangler secret put KEY
#   npx wrangler secret put GH_TOKEN
#   GH_REPO ("your-username/kindle-dash") as a text variable in the Cloudflare dashboard

[[kv_namespaces]]
binding = "DASH"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"
